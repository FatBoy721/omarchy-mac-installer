name: Diagnose J714s developer image precheck

# Fork-only diagnostic. Runs build-mac-image against the published developer
# inputs to surface the real package resolution failure. Produces logs only:
# no release, catalog, promotion, or hardware qualification.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  INPUT_URL: https://github.com/TripleU613/omarchy-mac-installer/releases/download/developer-inputs-j714s-76004483a972/j714s-developer-inputs-76004483a972.tar.zst
  INPUT_SHA256: 76004483a9722fb5b9b61154870efd5c6e40d21411a5d91631f09fffb284bd99

jobs:
  precheck:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare the ARM host
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes -qq libarchive-tools jq gnupg zstd btrfs-progs
          sudo modprobe loop
          sudo modprobe vfat
          sudo modprobe btrfs
          WORK=$RUNNER_TEMP/diag
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/evidence" "$WORK/input"

      - name: Fetch and verify the published inputs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' -- "$INPUT_URL" > "$WORK/inputs.tar.zst"
          printf '%s  %s\n' "$INPUT_SHA256" "$WORK/inputs.tar.zst" | sha256sum --check -
          zstd --decompress --stdout "$WORK/inputs.tar.zst" | tar -xf - -C "$WORK/input"

      - name: Resolve and build
        run: |
          set -euo pipefail
          bash image-builder/bin/mac-image-inputs resolve "$WORK/inputs" \
            --candidates "$WORK/input/candidate-set" --channel edge --image-profile j714s-developer \
            --recovery-app "$WORK/input/recovery" --cache "$WORK/cache" \
            --alarm-server 'https://arm-mirror.omarchy.org/$arch/$repo' 2>&1 | tee "$WORK/evidence/resolve.log"
          bash image-builder/bin/build-mac-image --inputs "$WORK/inputs" --image-profile j714s-developer \
            --candidates "$WORK/input/candidate-set" --recovery-app "$WORK/input/recovery" \
            --cache "$WORK/cache" "$WORK/out" 2>&1 | tee "$WORK/evidence/build.log"

      - name: Keep the logs
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$WORK/out" 2>/dev/null || true
          if [[ -d $WORK/out/logs ]]; then cp -r "$WORK/out/logs" "$WORK/evidence/logs"; fi

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-precheck-${{ github.sha }}
          path: ${{ runner.temp }}/diag/evidence/
          retention-days: 7
